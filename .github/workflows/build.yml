name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: draadloos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and coverage gate
        run: ./gradlew testDebugUnitTest koverVerifyDebug

      - name: Coverage report
        if: always()
        run: ./gradlew koverHtmlReportDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
